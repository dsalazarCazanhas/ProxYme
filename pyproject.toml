[project]
name = "proxyme"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "paramiko>=4.0",
    "bcrypt>=4.0",
    "cryptography>=41.0",
    "PyNaCl>=1.5",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxyme"]

[tool.ruff]
line-length = 100
target-version = "py311"
