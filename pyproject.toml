[project]
name = "proxyme"
version = "0.1.5"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dayron Salazar", email = "dsalazarcazanhas@gmail.com" },
]
dependencies = [
    "PySide6>=6.6",
    "paramiko>=4.0",
    "bcrypt>=4.0",
    "cryptography>=41.0",
    "PyNaCl>=1.5",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.9",
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxyme"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
    "S101",  # assert is fine — used throughout the test suite
]

[tool.pytest.ini_options]
addopts = "-ra"
