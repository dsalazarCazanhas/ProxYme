name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: dist/ProxYme.exe
            artifact: ProxYme-windows-x86_64.exe
          - os: ubuntu-22.04
            binary: dist/ProxYme
            artifact: ProxYme-linux-ubuntu22-x86_64
          # Uncomment when verified on that platform:
          # - os: ubuntu-24.04
          #   binary: dist/ProxYme
          #   artifact: ProxYme-linux-ubuntu24-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Build binary
        run: uv run pyinstaller proxyme.spec

      - name: Rename artifact
        shell: bash
        run: mv "${{ matrix.binary }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  source-zip:
    name: Source zip
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Create source zip
        run: |
          zip -r "ProxYme-${{ github.ref_name }}-source.zip" . \
            --exclude ".git/*" \
            --exclude ".venv/*" \
            --exclude "**/__pycache__/*" \
            --exclude "*.pyc" \
            --exclude "dist/*" \
            --exclude "build/*" \
            --exclude ".ruff_cache/*"

      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: ProxYme-${{ github.ref_name }}-source
          path: ProxYme-${{ github.ref_name }}-source.zip

  release:
    name: Create GitHub Release
    needs: [build, source-zip]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ProxYme-windows-x86_64.exe
            ProxYme-linux-ubuntu22-x86_64
            ProxYme-${{ github.ref_name }}-source.zip
